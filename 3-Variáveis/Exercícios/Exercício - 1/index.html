<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>Exercício de JavaScript</title>
    <!-- O script é chamado no final do body para garantir que a página carregou antes -->
</head>

<body>
    <h1>Resultado do Exercício</h1>

    <!-- Este parágrafo é o nosso alvo. O JavaScript vai colocar a mensagem final aqui dentro. -->
    <p id="resultado-final">Aguardando você preencher os dados...</p>
    
    <p><em>(Lembre-se de abrir o console do desenvolvedor (F12) para ver a análise completa dos tipos de dados).</em></p>

    <!-- É uma boa prática colocar o script no final do <body> -->
    <!-- Assim, garantimos que todo o HTML foi carregado antes do JavaScript tentar manipulá-lo -->
    <script src="script.js"></script>
</body>

</html>
