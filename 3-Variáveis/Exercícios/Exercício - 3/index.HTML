<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 3 - Cadastro de RH</title>
    <!-- Estilos para deixar a página mais apresentável -->
    <style>
        body { font-family: 'Courier New', Courier, monospace; padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #1c1e21; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        /* A tag <pre> é ótima para exibir texto pré-formatado, respeitando espaços e quebras de linha */
        pre { background-color: #e9ebee; padding: 20px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Relatório da Pessoa Colaboradora</h1>
        
        <!-- Este é o elemento "alvo". O JavaScript vai procurar por este 'id' para inserir o relatório. -->
        <pre id="relatorio-final">Aguardando preenchimento dos dados...</pre>
        
        <p><em>(Abra o console do desenvolvedor (F12) para ver a análise completa dos tipos de dados).</em></p>
    </div>

    <!--
      IMPORTANTE: A tag <script> com o atributo 'src' chama o nosso arquivo JavaScript.
      Colocamos no final do <body> para garantir que todo o HTML acima já tenha sido
      carregado pelo navegador antes do script tentar manipulá-lo.
    -->
    <script src="script.js"></script>

</body>
</html>
