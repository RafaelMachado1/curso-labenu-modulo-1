<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 - Funções (JS Separado)</title>
    
    <!-- Estilos CSS embutidos -->
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #333;
        }
        .resultado {
            background-color: #e9ecef;
            padding: 15px;
            border-left: 4px solid #17a2b8; /* Um tom de azul diferente */
            margin-top: 10px;
            border-radius: 4px;
            font-size: 1.1rem;
        }
        .resultado p {
            margin: 8px 0;
        }
        strong {
            color: #0056b3; /* Cor para destacar os resultados booleanos */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Exercício 2: Declaração de Funções</h1>

        <!-- Seção para o item (a) -->
        <h2>a) Soma de dois números</h2>
        <div id="resultado-a" class="resultado">
            <!-- Resultado da soma aparecerá aqui -->
        </div>

        <!-- Seção para o item (b) -->
        <h2>b) Maior ou igual</h2>
        <div id="resultado-b" class="resultado">
            <!-- Resultado da comparação aparecerá aqui -->
        </div>

        <!-- Seção para o item (c) -->
        <h2>c) Verificar se é par</h2>
        <div id="resultado-c" class="resultado">
            <!-- Resultado da verificação par/ímpar aparecerá aqui -->
        </div>
        
        <!-- Seção para o item (d) -->
        <h2>d) Cálculo de Salário Líquido</h2>
        <div id="resultado-d" class="resultado">
            <!-- Resultado do cálculo de salário aparecerá aqui -->
        </div>
    </div>

    <!-- Link para o arquivo JavaScript (com 'defer' para carregar após o HTML) -->
    <script src="script.js" defer></script>

</body>
</html>
