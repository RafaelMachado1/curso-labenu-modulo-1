<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página que aparece na aba do navegador -->
    <title>Exercício 3</title>
</head>

<body>
    <!-- Título principal da página -->
    <h1>Tabela de conteúdos</h1>

    <!-- A tag <table> inicia a criação da tabela -->
    <table>
        <!-- <thead> agrupa o conteúdo do cabeçalho da tabela -->
        <thead>
            <!-- <tr> cria a linha do cabeçalho -->
            <tr>
                <!-- <th> define cada célula do cabeçalho -->
                <th>Assunto</th>
                <th>Módulo</th>
                <th>Qtd aulas</th>
            </tr>
        </thead>

        <!-- <tbody> agrupa o conteúdo do corpo da tabela -->
        <tbody>
            <!-- Primeira linha de dados -->
            <tr>
                <!-- <td> define cada célula de dados -->
                <td>HTML</td>
                <td>Intro Web</td>
                <td>02</td>
            </tr>

            <!-- Segunda linha de dados -->
            <tr>
                <td>CSS</td>
                <td>Intro Web</td>
                <td>04</td>
            </tr>

            <!-- Terceira linha de dados -->
            <tr>
                <td>Integração com APIs</td>
                <td>Front-end React</td>
                <td>04</td>
            </tr>

            <!-- Quarta linha de dados -->
            <tr>
                <td>SQL</td>
                <td>Back-end</td>
                <td>04</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
