<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página que aparece na aba do navegador -->
    <title>Exercício 1</title>
</head>

<body>
    <!-- Título principal da página -->
    <h1>Conteúdo do Curso</h1>

    <!-- Módulo 1 -->
    <h2>Módulo 1</h2>
    <!-- Lista não ordenada para os tópicos do módulo -->
    <ul>
        <!-- <i> para deixar o texto em itálico -->
        <li><i>Fundamentos JS</i></li>
        <li>Introdução ao desenvolvimento web</li>
    </ul>

    <!-- Módulo 2 -->
    <h2>Módulo 2</h2>
    <ul>
        <!-- <b> ou <strong> para deixar o texto em negrito -->
        <li><b>Front-end</b> com React</li>
    </ul>

    <!-- Módulo 3 -->
    <h2>Módulo 3</h2>
    <ul>
        <!-- <u> para o sublinhado. Podemos colocar dentro de um link também -->
        <li><a href="#"><u>Backend</u></a></li>
    </ul>

    <!-- Módulo 4 -->
    <h2>Módulo 4</h2>
    <ul>
        <!-- Podemos aninhar as tags para combinar os estilos -->
        <li>Testes e <b><i>deploy</i></b></li>
    </ul>

</body>

</html>
